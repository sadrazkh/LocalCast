appId: net.localcast.desktop
productName: LocalCast
copyright: LocalCast

directories:
  output: release
  buildResources: assets

files:
  - dist/**
  - assets/icons/**
  - package.json
  # The workspace packages are hoisted to the repo root, so they have to be named
  # explicitly or electron-builder will ship an app that cannot resolve them.
  - '!node_modules/**'
  - node_modules/@localcast/**

extraResources:
  # The Go sidecar. It is a plain executable launched as a child process — no service, no
  # driver, and therefore no elevation prompt during install.
  #
  # `from` points at the source *directory*, which is tracked and therefore always present,
  # and the executable is selected with a filter. Pointing `from` straight at netedge.exe
  # would make the source path itself vanish whenever the sidecar has not been built — and it
  # is never committed — which electron-builder reports only as a "file source doesn't exist"
  # warning before happily producing an installer with no remote access in it. A filter that
  # matches nothing copies nothing and says so through scripts/prepack.mjs instead.
  - from: ../../native/netedge
    to: .
    filter: ['netedge.exe']
  # SumatraPDF does the actual printing. Bundled so printing does not depend on whatever
  # PDF reader the user happens to have.
  #
  # It has to land directly in resources/vendor, because that is the vendorDir the server
  # joins SumatraPDF.exe onto — so this one cannot use the directory-plus-filter trick above
  # without changing the layout. `vendor/bin` is instead guaranteed to exist by
  # scripts/prepack.mjs, which the package script runs first; empty, it copies nothing.
  - from: ../../vendor/bin
    to: vendor
    filter: ['**/*']
  # better_sqlite3 compiled for Electron's ABI.
  #
  # node_modules deliberately holds the Node-ABI build so the test suite runs, and the app
  # loads this copy instead through better-sqlite3's nativeBinding option. Without this entry
  # the installer ships only the Node build and the app dies at its first database call with
  # NODE_MODULE_VERSION — an installer that installs cleanly and then cannot start.
  #
  # The glob covers the electron-<abi> directory scripts/rebuild-native.mjs writes, so the
  # path does not have to be restated here every time Electron's ABI changes. main/index.ts
  # joins resources/native/better_sqlite3.node, which is why the file is flattened.
  - from: ../../vendor/native
    to: native
    filter: ['better_sqlite3.node']
  # The built PWA, served to phones by the Node server.
  - from: ../pwa/dist
    to: web
    filter: ['**/*']
  - from: assets
    to: assets
    filter: ['icons/**']

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icons/app-512.png
  # Nothing here needs elevation: tsnet is userspace WireGuard, the server binds loopback,
  # and printing goes through the ordinary spooler. Asking for admin would contradict the
  # product's central promise.
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LocalCast
  # Per-user install into %LOCALAPPDATA%, which is what keeps the whole flow UAC-free.
  installerLanguages: [en_US]

publish: null
