appId: net.localcast.desktop
productName: LocalCast
copyright: LocalCast

directories:
  output: release
  buildResources: assets

files:
  - dist/**
  - assets/icons/**
  - package.json
  # Nothing excludes node_modules here, and that is deliberate.
  #
  # It used to say `'!node_modules/**'` with @localcast added back by hand, which produced an
  # installer that launched and immediately died with:
  #
  #   Error [ERR_MODULE_NOT_FOUND]: Cannot find package 'zod' imported from
  #   ...\resources\app.asar\dist\main\appConfig.js
  #
  # In an npm workspace every third-party dependency is hoisted to the repository root, so
  # that one exclusion dropped zod, express, jose, qrcode and better-sqlite3 along with the
  # rest. electron-builder resolves the production dependency tree itself and follows the
  # hoisting; the exclusion was solving a problem that did not exist and creating one that
  # only appears after packaging.

extraResources:
  # The Go sidecar. It is a plain executable launched as a child process — no service, no
  # driver, and therefore no elevation prompt during install.
  #
  # `from` points at the source *directory*, which is tracked and therefore always present,
  # and the executable is selected with a filter. Pointing `from` straight at netedge.exe
  # would make the source path itself vanish whenever the sidecar has not been built — and it
  # is never committed — which electron-builder reports only as a "file source doesn't exist"
  # warning before happily producing an installer with no remote access in it. A filter that
  # matches nothing copies nothing and says so through scripts/prepack.mjs instead.
  - from: ../../native/netedge
    to: .
    filter: ['netedge.exe']
  # SumatraPDF does the actual printing. Bundled so printing does not depend on whatever
  # PDF reader the user happens to have.
  #
  # It has to land directly in resources/vendor, because that is the vendorDir the server
  # joins SumatraPDF.exe onto — so this one cannot use the directory-plus-filter trick above
  # without changing the layout. `vendor/bin` is instead guaranteed to exist by
  # scripts/prepack.mjs, which the package script runs first; empty, it copies nothing.
  - from: ../../vendor/bin
    to: vendor
    filter: ['**/*']
  # better_sqlite3 compiled for Electron's ABI.
  #
  # node_modules deliberately holds the Node-ABI build so the test suite runs, and the app
  # loads this copy instead through better-sqlite3's nativeBinding option. Without this entry
  # the installer ships only the Node build and the app dies at its first database call with
  # NODE_MODULE_VERSION — an installer that installs cleanly and then cannot start.
  #
  # The glob covers the electron-<abi> directory scripts/rebuild-native.mjs writes, so the
  # path does not have to be restated here every time Electron's ABI changes. main/index.ts
  # joins resources/native/better_sqlite3.node, which is why the file is flattened.
  - from: ../../vendor/native
    to: native
    filter: ['better_sqlite3.node']
  # The built PWA, served to phones by the Node server.
  - from: ../pwa/dist
    to: web
    filter: ['**/*']
  - from: assets
    to: assets
    filter: ['icons/**']

# Sits beside LocalCast.exe rather than inside resources, because it is for the user to
# double-click. It is harmless in an installed copy — running it there simply starts the same
# app in portable mode — and it is the whole point of the zip build.
extraFiles:
  - from: assets/LocalCast-Portable.cmd
    to: LocalCast-Portable.cmd

win:
  target:
    - target: nsis
      arch: [x64]
    # A single executable that installs nothing. electron-builder sets
    # PORTABLE_EXECUTABLE_DIR when it runs, which is how the app knows to keep its database
    # and tailnet identity beside the exe rather than in %APPDATA%.
    - target: portable
      arch: [x64]
    # The same thing unpacked, for anyone who would rather see the files. Its launcher sets
    # LOCALCAST_PORTABLE=1 to get the same behaviour.
    - target: zip
      arch: [x64]
  icon: assets/icons/app-512.png
  # Nothing here needs elevation: tsnet is userspace WireGuard, the server binds loopback,
  # and printing goes through the ordinary spooler. Asking for admin would contradict the
  # product's central promise.
  requestedExecutionLevel: asInvoker

# Distinct, sortable names. Three Windows artifacts land in one release directory and
# "LocalCast 0.1.0.exe" next to "LocalCast Setup 0.1.0.exe" is a coin toss for the user.
artifactName: LocalCast-${version}-${os}-${arch}.${ext}

nsis:
  artifactName: LocalCast-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LocalCast
  # Per-user install into %LOCALAPPDATA%, which is what keeps the whole flow UAC-free.
  installerLanguages: [en_US]

portable:
  artifactName: LocalCast-Portable-${version}.${ext}
  # Shown while the single exe unpacks itself, which takes a moment at this size.
  splashImage: null

publish: null
