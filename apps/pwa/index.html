<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <!--
      viewport-fit=cover plus the safe-area insets in CSS: once the PWA is installed to the
      iOS home screen it runs without Safari's chrome, so the app itself is responsible for
      staying clear of the notch and the home indicator.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="color-scheme" content="dark" />
    <!-- Matches --lc-bg-base so the iOS status bar does not sit on a different colour. -->
    <meta name="theme-color" content="#0d0e12" />

    <title>LocalCast</title>

    <!-- iOS ignores the web manifest's display mode; these are what make it standalone. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LocalCast" />
    <!-- iOS does not read SVG here, so this is a real PNG generated by scripts/generate-icons.mjs. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />

    <!--
      The camera is only ever used for the pairing QR scan, and nothing in this app should be
      embeddable. Both are also enforced by response headers on the server; this is the
      belt-and-braces copy that survives being opened from a file.
    -->
    <meta http-equiv="Permissions-Policy" content="camera=(self), microphone=(), geolocation=()" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>برای استفاده از LocalCast باید جاوااسکریپت فعال باشد.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
