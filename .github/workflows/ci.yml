name: CI

# The same build and the same tests as a release, minus packaging and publishing. If this is
# green, tagging is the only thing left — a release should never be the first time the
# pipeline discovers a problem.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  GO_VERSION: '1.27'

jobs:
  build:
    # Windows, matching the release. The server, the printing path and the native rebuild are
    # all Windows-shaped, so a Linux run would be green about a build nobody ships.
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: native/netedge/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Build netedge
        run: npm run netedge:build

      - name: Vet and test netedge
        working-directory: native/netedge
        run: |
          go vet ./...
          go test ./...

      - name: Build workspaces
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      # The failure detail is re-emitted as annotations on purpose.
      #
      # Downloading a job log needs admin rights on the repository, so a contributor without
      # them can see that CI is red and nothing about why. Annotations are readable through
      # the public check-runs API, which makes a remote failure diagnosable instead of
      # guessable — and guessing costs a full run each time.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          if npm test 2>&1 | tee test-output.txt; then
            exit 0
          fi
          grep -aE "FAIL|AssertionError|✕|×|→|Error:|error TS" test-output.txt \
            | head -20 \
            | while IFS= read -r line; do echo "::error::${line}"; done
          exit 1

      # The project's own health check, run last so its output is the final word in the log.
      # It exits non-zero when something blocking is missing, which on a runner would mean the
      # steps above lied — so a failure here is worth surfacing rather than swallowing.
      - name: Doctor
        run: npm run doctor
